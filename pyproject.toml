
[project]
name = "snooker-score-bot"
version = "0.1"
requires-python = ">=3.15"
dependencies = [
    "fastapi==0.162.5",
    "google-cloud-logging==3.17.0",
    "gspread==6.2.1",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "google-auth==2.62.2",
    "google-genai==3.2.0",
    "pydantic==2.14.3",
    "python-multipart==0.0.33",
    "pytz==2026.6",
    "tabulate==0.10.0",
    "twilio==9.13.0",
    "uvicorn==0.54.0",
    "click==8.5.1",
]

[project.scripts]
snooker = "snooker_score_bot.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snooker_score_bot"]

[project.optional-dependencies]
dev = ["python-dotenv", "pytest", "pytest-dotenv", "ruff", "freezegun"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I"]
